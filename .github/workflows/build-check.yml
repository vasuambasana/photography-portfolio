name: Build check

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Test
        run: npm run test

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
